[project]
name = "jobradar"
version = "0.1.0"
description = "Job radar that matches public job posts to a CV."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "pypdf>=5.1",
  "beautifulsoup4>=4.12",
  "apscheduler>=3.10",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
browser = ["playwright>=1.48"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
